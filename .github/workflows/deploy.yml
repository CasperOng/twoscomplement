name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the built site to the gh-pages branch.
permissions:
  contents: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Push the contents of dist/ to the gh-pages branch. Pages then serves
      # the site straight from that branch.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          # Custom domain: keeps the CNAME on the gh-pages branch so Pages
          # doesn't drop the custom-domain setting on each deploy. Replace with
          # your domain, e.g. twoscomplement.example.com.
          cname: twoscomplement.casperong.xyz
